services:
  - type: web
    name: store-ai-service
    env: docker
    dockerfilePath: Dockerfile.ai
    plan: starter
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001
    envVars:
      - key: PORT
        value: 8001

  - type: web
    name: store-intelligence-web
    env: docker
    dockerfilePath: Dockerfile.web
    plan: starter
    startCommand: npx prisma db push && npx prisma db seed && npm run start
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: file:/opt/render/project/src/prisma/dev.db
      - key: AI_SERVICE_URL
        fromService:
          name: store-ai-service
          type: web
          property: host
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: sqlite-db-volume
      mountPath: /opt/render/project/src/prisma
      sizeGB: 1
